# Runs the whole MERN stack locally:  docker compose up --build
#   Site:  http://localhost:8080      Admin: http://localhost:8080/admin
#   API:   http://localhost:5000/api/health
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/portfolio
      CLIENT_ORIGIN: http://localhost:8080,http://localhost:5173
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo-data:
